<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; width: 2880px; height: 2160px; overflow: hidden; }
  body { font-family: "Segoe UI", Arial, Helvetica, sans-serif; background: #F7F7F1; }
</style></head>
<body>
<svg width="2880" height="2160" viewBox="0 0 2880 2160" xmlns="http://www.w3.org/2000/svg">
  <rect width="2880" height="2160" fill="#F7F7F1"/>

  <!-- мягкие зелёные пятна по краям (не несут смысла, переживают кроп) -->
  <circle cx="240" cy="1080" r="520" fill="#00A64E" opacity="0.10"/>
  <circle cx="2660" cy="1080" r="560" fill="#00A64E" opacity="0.10"/>

  <!-- гигантский водяной знак B в центре -->
  <g opacity="0.07" transform="translate(1180 560) scale(8.6)">
    <path d="M0 0 H95 C140 0 155 22 155 50 C155 76 140 100 112 100 C146 100 160 124 160 150 C160 180 140 200 100 200 H0 Z" fill="#00A64E"/>
    <rect x="62" y="30" width="58" height="44" rx="22" fill="#F7F7F1"/>
    <rect x="62" y="132" width="68" height="44" rx="22" fill="#F7F7F1"/>
  </g>

  <!-- логотип по центру -->
  <g transform="translate(1080 380)">
    <g transform="scale(0.7)">
      <path d="M0 0 H95 C140 0 155 22 155 50 C155 76 140 100 112 100 C146 100 160 124 160 150 C160 180 140 200 100 200 H0 Z" fill="#00A64E"/>
      <rect x="62" y="30" width="58" height="44" rx="22" fill="#F7F7F1"/>
      <rect x="62" y="132" width="68" height="44" rx="22" fill="#F7F7F1"/>
    </g>
    <text x="160" y="108" font-size="95" font-weight="800" fill="#0B0B0B" letter-spacing="-2">BankFake</text>
  </g>

  <!-- крупный заголовок, две строки, строго по центру -->
  <text x="1440" y="850" font-size="190" font-weight="800" fill="#0B0B0B" text-anchor="middle" textLength="1400" lengthAdjust="spacingAndGlyphs">ИИ-АССИСТЕНТ</text>
  <text x="1440" y="1080" font-size="190" font-weight="800" fill="#00A64E" text-anchor="middle" textLength="1400" lengthAdjust="spacingAndGlyphs">И НОВЫЕ ПЛАТЕЖИ</text>

  <!-- зелёная плашка -->
  <g transform="translate(1440 1230)">
    <rect x="-470" y="0" width="940" height="140" rx="70" fill="#00A64E"/>
    <text x="0" y="95" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">УМНЫЙ ПОМОЩНИК</text>
  </g>

  <!-- подстрочник -->
  <text x="1440" y="1530" font-size="58" font-weight="500" fill="#0B0B0B" opacity="0.72" text-anchor="middle" textLength="1500" lengthAdjust="spacingAndGlyphs">ЖКХ · ГИБДД · Госуслуги · Мобильная связь</text>

  <!-- три искры внизу -->
  <g fill="#00A64E" opacity="0.85">
    <circle cx="1330" cy="1690" r="14"/>
    <circle cx="1440" cy="1690" r="14"/>
    <circle cx="1550" cy="1690" r="14"/>
  </g>
</svg>
</body>
</html>
